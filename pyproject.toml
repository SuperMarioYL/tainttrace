[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tainttrace"
version = "0.1.0"
description = "Dynamic taint tracking that computes the blast radius of a landed prompt injection across an agent's tool-call graph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "supermario_leo", email = "leo.stack@outlook.com" },
]
keywords = [
    "prompt-injection",
    "agent",
    "agent-security",
    "taint-tracking",
    "dataflow",
    "blast-radius",
    "incident-response",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/tainttrace"
Repository = "https://github.com/SuperMarioYL/tainttrace"
Issues = "https://github.com/SuperMarioYL/tainttrace/issues"

[project.scripts]
tainttrace = "tainttrace.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tainttrace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
