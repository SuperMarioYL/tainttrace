<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：不可信 Web 内容 → @tracked 工具 → 污点标签 → 工具调用图 → 爆炸半径/隔离清单">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
    <marker id="ah-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E5484D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <text x="40" y="40" font-size="15" font-weight="700" fill="#1D1D1F">污点如何在 Agent 工具调用图中传播</text>
  <text x="40" y="60" font-size="12" font-weight="500" fill="#6E6E73">taint_source() 在边界打标 → @tracked 记录每次调用 → 沿数据依赖并集传播 → 隔离 = 可达副作用闭包</text>

  <!-- record-time row (top) -->
  <g stroke="#E5484D" stroke-width="1.8" fill="none">
    <line x1="190" y1="130" x2="252" y2="130" marker-end="url(#ah-r)"/>
    <line x1="392" y1="130" x2="454" y2="130" marker-end="url(#ah-r)"/>
  </g>
  <g>
    <rect x="40"  y="100" width="150" height="60" rx="15" fill="#E5484D" fill-opacity="0.10" stroke="#E5484D" stroke-width="1.5"/>
    <text x="115" y="126" text-anchor="middle" font-size="13.5" font-weight="600" fill="#B42318">不可信 Web 内容</text>
    <text x="115" y="146" text-anchor="middle" font-size="11" font-weight="500" fill="#B42318">taint_source()</text>

    <rect x="252" y="100" width="140" height="60" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="322" y="126" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4B3FC4">@tracked 工具</text>
    <text x="322" y="146" text-anchor="middle" font-size="11" font-weight="500" fill="#4B3FC4">Agent tool calls</text>

    <rect x="454" y="100" width="150" height="60" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="529" y="126" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4B3FC4">Tracker</text>
    <text x="529" y="146" text-anchor="middle" font-size="11" font-weight="500" fill="#4B3FC4">in-proc recorder</text>
  </g>

  <!-- to trace file -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="529" y1="160" x2="529" y2="206" marker-end="url(#ah-l)"/>
  </g>
  <rect x="454" y="206" width="150" height="46" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
  <text x="529" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#0A4F9E">run.jsonl 轨迹</text>

  <!-- analysis row (bottom) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="454" y1="290" x2="392" y2="290" marker-end="url(#ah-l)"/>
    <line x1="252" y1="290" x2="190" y2="290" marker-end="url(#ah-l)"/>
    <line x1="529" y1="252" x2="529" y2="266" marker-end="url(#ah-l)"/>
  </g>
  <g>
    <rect x="454" y="266" width="150" height="60" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="529" y="292" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0A4F9E">graph.py</text>
    <text x="529" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#0A4F9E">重建 + 拓扑传播</text>

    <rect x="252" y="266" width="140" height="60" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="322" y="292" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0A4F9E">quarantine.py</text>
    <text x="322" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#0A4F9E">传递闭包</text>

    <rect x="40"  y="266" width="150" height="60" rx="15" fill="#E5484D" fill-opacity="0.12" stroke="#E5484D" stroke-width="1.6"/>
    <text x="115" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B42318">爆炸半径 / 隔离清单</text>
    <text x="115" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#B42318">4/11 tainted · 7 clean</text>
  </g>
</svg>
