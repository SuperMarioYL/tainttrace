name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (compile-check)
        run: python -m compileall -q src examples tests
      - name: Test
        run: python -m pytest -q
      - name: Smoke the demo
        run: |
          python examples/poisoned_web_demo.py
          tainttrace report --trace run.jsonl --json
